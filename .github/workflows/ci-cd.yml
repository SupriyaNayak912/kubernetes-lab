name: CI/CD Pipeline - Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-lab:${{ github.run_number }}

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Update Deployment Image
        shell: powershell
        run: |
          $IMAGE = "${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-lab:${{ github.run_number }}"
          (Get-Content deployment.yaml) -replace 'image: nginx:alpine', "image: $IMAGE" | Set-Content deployment.yaml

      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          kubectl apply -f deployment.yaml

      - name: Verify Deployment
        shell: powershell
        run: |
          kubectl rollout status deployment/sample-web-app --timeout=60s
          kubectl get deployment sample-web-app
          kubectl get pods